[extend]
useDefault = true

[allowlist]
description = "Ignore local unversioned environment files, temporary caches, and test fixtures"
paths = [
    '''(?i)(\A|[/\\])\.env''',
    '''node_modules''',
    '''dist''',
    '''__pycache__''',
    '''\.pytest_cache''',
    '''\.git'''
]
stopwords = [
    "linkedInStatus"
]
commits = [
    "458e1e6a57c217f548be72a430bc27371b36e649"
]
