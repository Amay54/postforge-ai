[extend]
useDefault = true

[allowlist]
description = "Ignore local unversioned environment files, temporary caches, and build artifacts"
paths = [
    '''(?i)(\A|[/\\])\.env''',
    '''node_modules''',
    '''dist''',
    '''__pycache__''',
    '''\.pytest_cache''',
    '''\.git'''
]
stopwords = [
    "linkedInStatus",
    "LinkedInStatus",
    "accountStatus"
]
regexes = [
    '''linkedInStatus\s*:\s*LinkedInStatus''',
    '''accountStatus\s*:\s*LinkedInStatus'''
]
commits = [
    "458e1e6a57c217f548be72a430bc27371b36e649"
]
